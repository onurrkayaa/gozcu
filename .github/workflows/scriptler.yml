name: Analiz script'leri

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Olcum mantiginin testleri
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      # HERIDAL veri kumesi (2,7 GB) ve model agirliklari CI'ya INDIRILMEZ.
      # Buradaki testler saf mantigi olcer: karo geometrisi, esleme kurali,
      # CSV bicimi, kenar kurali. Uzun cikarim kosusu yapilmaz.
      - name: Bagimliliklar
        run: pip install -r requirements-test.txt

      - name: Testler
        run: pytest scripts/tests tests -q
