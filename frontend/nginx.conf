# Gozcu arayuzu + API vekili.
#
# Arayuz ve API AYNI KAYNAKTAN gorunur (http://localhost:8080). Boylece:
#   - tarayici capraz kaynak istegi yapmaz, CORS ayarina gerek kalmaz,
#   - backend'in 8000 portunu disariya acmaya gerek kalmaz.
#
# TLS BURADA SONLANDIRILMAZ. Gercek bir dagitimda HTTPS'i onde duran bir ters
# vekil veya yuk dengeleyici sonlandirir; bu dosya duz HTTP konusur ve yerel
# demo icindir.

server {
    listen 80;
    server_name _;

    # Yuklenen kareler 4000x3000 JPEG; varsayilan 1 MB siniri yetmez.
    client_max_body_size 32m;

    # Sunucu surumunu yanitlarda duyurmayalim.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    # API ve admin backend'e gider.
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin panelinin statik dosyalari (whitenoise servis ediyor).
    location /static/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
    }

    # /media/ KAPALIDIR. Goruntuye erisimin tek yolu /api/frames/{id}/image/
    # ucudur; o uc Authorization basligini okur ve karenin gorevine uyeligi
    # dogrular. Burada acikca 404 donuluyor ki tek sayfalik uygulamanin genel
    # yedegi bu yolu sessizce yutmasin ve kural disaridan sinanabilsin.
    location /media/ {
        return 404;
    }

    # Hash'li varliklar icerik degisince ad degistirir; uzun sureli onbellek guvenli.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Tek sayfalik uygulama: bilinmeyen yollar index.html'e duser ki
    # /gorevler/12 gibi adresler dogrudan acilabilsin.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
