services:
  db:
    # PostgreSQL 16 + PostGIS 3.5.
    # Resmi postgis/postgis yalnizca amd64 yayinlar. imresamu/postgis, docker-postgis
    # bakimcilarindan birinin cok mimarili TEST deposudur ve arm64 destegi DENEYSEL
    # olarak isaretlidir; Apple Silicon uzerinde calisabilmek icin bu etiket secildi.
    # Yedek: image: postgis/postgis:16-3.5 + platform: linux/amd64 (Rosetta, daha yavas)
    image: imresamu/postgis:16-3.5
    container_name: gozcu_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    # Celery broker'i ve sonuc deposu. Resmi redis imaji; etiket yama surumune
    # kadar sabit. arm64 destegi "docker image inspect" ile dogrulandi.
    image: redis:8.10.1-alpine
    container_name: gozcu_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build: ./backend
    container_name: gozcu_web
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # Agirlik depoya girmez; asagidaki salt okunur baglama ile gelir.
      ONNX_MODEL_PATH: /models/model512_best.onnx
    volumes:
      - ./backend:/app
      - ./agirliklar:/models:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # web ile AYNI imaj: ayni kod, ayni bagimliliklar, ayri surec.
    build: ./backend
    container_name: gozcu_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # Gercek dedektorun modeli. Yol konteyner icidir; kaynak klasor host'ta
      # ./agirliklar, salt okunur baglanir.
      ONNX_MODEL_PATH: /models/model512_best.onnx
    volumes:
      - ./backend:/app
      - ./agirliklar:/models:ro
    command: ["celery", "-A", "gozcu_api", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
