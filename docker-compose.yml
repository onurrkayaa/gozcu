# Gozcu -- uretim benzeri yigin.
#
# Bu dosya TEK BASINA calistirildiginda uretim benzeri davranir:
#   - Django gunicorn ile kosar (runserver degil),
#   - arayuz derlenmis olarak nginx'ten gelir (Vite dev sunucusu degil),
#   - PostgreSQL ve Redis HOST'A ACILMAZ; yalnizca ic agdan erisilir,
#   - disariya acilan tek adres arayuzun 8080 portudur ve o da 127.0.0.1'e bagli.
#
# Gelistirme icin override dosyasi eklenir:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# TLS BURADA YOKTUR. Gercek bir dagitimda HTTPS'i onde duran bir ters vekil
# sonlandirir; bu yigin duz HTTP konusur ve yerel kullanim icindir.

services:
  db:
    # PostgreSQL 16 + PostGIS 3.5.
    # Resmi postgis/postgis yalnizca amd64 yayinlar. imresamu/postgis, docker-postgis
    # bakimcilarindan birinin cok mimarili TEST deposudur ve arm64 destegi DENEYSEL
    # olarak isaretlidir; Apple Silicon uzerinde calisabilmek icin bu etiket secildi.
    # Yedek: image: postgis/postgis:16-3.5 + platform: linux/amd64 (Rosetta, daha yavas)
    image: imresamu/postgis:16-3.5
    container_name: gozcu_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    # Celery broker'i ve sonuc deposu. Resmi redis imaji; etiket yama surumune
    # kadar sabit. arm64 destegi "docker image inspect" ile dogrulandi.
    image: redis:8.10.1-alpine
    container_name: gozcu_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build: ./backend
    image: gozcu-backend
    container_name: gozcu_web
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # Agirlik depoya girmez; asagidaki salt okunur baglama ile gelir.
      # Dosya yoksa gercek dedektor kurulamaz ve kosu failed olur -- sessizce
      # sahte dedektore DUSULMEZ.
      ONNX_MODEL_PATH: /models/model512_best.onnx
    volumes:
      # Yuklenen kareler ADLI BIRIMDE durur, host klasorunde degil.
      #
      # Bir host klasorunu baglamak Linux'ta calismiyor: konteyner root
      # olmayan bir kullaniciyla (uid 10001) kosuyor ve host klasorunun sahibi
      # baska bir kullanici oldugu icin yazma izni alamiyor. Adli birim, imajdaki
      # /app/media dizininin sahipligini devraldigi icin bu sorun olusmuyor.
      # Gelistirme kosumu host klasorunu docker-compose.dev.yml icinde baglar.
      - mediadata:/app/media
      - ./agirliklar:/models:ro
      # Gercek modlu demo icin yerel veri kumesi (varsa). Yoksa dizin bos gelir
      # ve demo sentetik moda duser.
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5).status == 200 else 1)\""]
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # web ile AYNI imaj: ayni kod, ayni bagimliliklar, ayri surec.
    build: ./backend
    image: gozcu-backend
    container_name: gozcu_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      ONNX_MODEL_PATH: /models/model512_best.onnx
    volumes:
      # web ile AYNI birim: isci de ayni kareleri okuyup yaziyor.
      - mediadata:/app/media
      - ./agirliklar:/models:ro
      - ./data:/data:ro
    command: ["celery", "-A", "gozcu_api", "worker", "--loglevel=info", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A gozcu_api inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: gozcu-frontend
    container_name: gozcu_frontend
    restart: unless-stopped
    # Yalnizca 127.0.0.1: yigin ayni agdaki baska makinelere acilmasin.
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      web:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  mediadata:
