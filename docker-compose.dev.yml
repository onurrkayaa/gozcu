# Gelistirme override'i.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Farklari:
#   - Backend kodu host'tan baglanir ve runserver otomatik yeniden yukler.
#   - Backend 8000 portundan dogrudan erisilebilir (API denemeleri, admin).
#   - Arayuz konteyneri calismaz; `cd frontend && npm run dev` kullanilir
#     (5173, Vite proxy'si /api isteklerini 8000'e yollar).
#   - media/ host klasorune duser: olcum script'leri zamanlama kaydini
#     (backend/media/zamanlama.jsonl) konteyner disindan okuyor.

services:
  web:
    build: ./backend
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - ./backend:/app
      # Adli birimi host klasoruyle DEGISTIRIR (ayni hedef yol): olcum
      # script'leri zamanlama kaydini konteyner disindan okuyabilsin.
      - ./backend/media:/app/media
      - ./agirliklar:/models:ro
      - ./data:/data:ro
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_DEBUG: "1"

  worker:
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
      - ./agirliklar:/models:ro
      - ./data:/data:ro
    environment:
      DJANGO_DEBUG: "1"

  frontend:
    # Gelistirmede Vite dev sunucusu kullanilir; bu konteyner calismasin.
    profiles: ["kullanilmiyor"]
